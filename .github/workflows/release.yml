# ──────────────────────────────────────────────────────────────
# Release — сборка релизных артефактов по тегу v*
# ──────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build-linux:
    name: binary (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system deps
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq libpulse-dev libasound2-dev clang
      - name: Build release
        env:
          RUST_BACKTRACE: 1
        run: cargo build --release --features whisper,tui
      - name: Pack binary
        run: |
          mkdir -p dist
          cp target/release/audiosub dist/audiosub
          cp target/release/audiosub "dist/audiosub-${{ github.ref_name }}-linux-amd64"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiosub-linux-amd64
          path: dist/*
          if-no-files-found: error

  docker:
    name: docker (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ENGINE=both
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: [build-linux, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: audiosub-linux-amd64
          path: release/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
