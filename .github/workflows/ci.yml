# ──────────────────────────────────────────────────────────────
# CI — проверка каждого push/PR в main
# ──────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimal
            args: --no-default-features
          - label: default
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Install system deps
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq libpulse-dev libasound2-dev
      - name: Clippy
        run: cargo clippy ${{ matrix.args }} -- -D warnings

  check:
    name: check (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimal
            args: --no-default-features
          - label: default
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system deps
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq libpulse-dev libasound2-dev
      - name: Cargo check
        run: cargo check ${{ matrix.args }}

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system deps
        run: >
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq libpulse-dev libasound2-dev
      - name: cargo test
        run: cargo test --no-default-features

  audit:
    name: audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: cargo audit
        uses: actions-rust-lang/audit@v1

  machete:
    name: unused-deps
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - name: Check unused dependencies
        run: cargo machete

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (vosk)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: audiosub:ci
          build-args: |
            ENGINE=vosk
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image
        run: docker run --rm audiosub:ci --help
